# Required check `pr-title` for `main`. Rules and rationale: docs/11-ci-cd.md.
# Lives outside ci.yml so a title edit re-runs this check alone: `edited` in ci.yml would
# cancel and restart the whole CI run on every title or body edit. The job id is the required
# status-check name in the `main` ruleset — do not rename it without updating the ruleset.

name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  # PR-only workflow: the newest title always supersedes an older run.
  cancel-in-progress: true

jobs:
  # PR title becomes the squash-commit subject → must be a Conventional Commit.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # the action reads the PR's current title through the API
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start lower-case and be written in the imperative
            (e.g. "feat(media): add album-art tint"). See docs/11-ci-cd.md#commits-and-pr-titles.
