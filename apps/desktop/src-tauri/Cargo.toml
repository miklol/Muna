[workspace]
members = ["crates/muna-platform", "crates/muna-core", "crates/muna-probe"]
# `cargo test`/`clippy` on this manifest (the CI commands) cover every crate, not just `muna`.
default-members = [".", "crates/muna-platform", "crates/muna-core", "crates/muna-probe"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/miklol/Muna"

[workspace.dependencies]
anyhow = "1.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["sync", "time", "rt", "macros"] }
tracing = { version = "0.1", features = ["log"] }
muna-core = { path = "crates/muna-core" }
muna-platform = { path = "crates/muna-platform" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "muna"
description = "A notch for Windows: a quiet black strip that morphs into a productivity hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "muna_lib"
crate-type = ["lib"]
# Unit-test harnesses for the lib and bin link Tauri but cannot carry the Common Controls v6
# manifest (see build.rs), so they would abort at load time on Windows. Shell tests live in
# `tests/` where `rustc-link-arg-tests` applies.
test = false
doctest = false

[[bin]]
name = "muna"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow.workspace = true
log = "0.4"
muna-core.workspace = true
muna-platform.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri = { version = "2.11", features = ["specta", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-log = "2.9"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.11"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27"

[features]
default = []
# Enables the `#[ignore]`d tests that touch real Windows APIs (nightly lab machine only).
platform-tests = ["muna-platform/platform-tests"]

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
