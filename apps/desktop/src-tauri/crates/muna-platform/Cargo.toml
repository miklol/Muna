[package]
name = "muna-platform"
description = "Platform service traits, the scripted FakePlatform used by every test, and the Windows implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
parking_lot.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# webview2-com and its windows-core 0.61 track the versions wry uses so `ICoreWebView2Controller`
# is the same type Tauri hands out from `with_webview`. The rename keeps the bare `windows_core`
# path for 0.62, which `windows::core::implement` expands to.
webview2-com = "0.38"
webview2-core = { package = "windows-core", version = "0.61" }
windows-core = "0.62"
# Same version `windows` 0.62 depends on; needed to name `IIterable<HSTRING>` for the
# `DeviceWatcher` property list.
windows-collections = "0.3"
# Same version `windows` 0.62 depends on; names `IAsyncOperation` so the location fix can wait
# on it with a deadline instead of `join`.
windows-future = "0.3"
# Internal-panel brightness (docs/modules/hud.md): `WmiMonitorBrightness*` in `ROOT\WMI`
# through a typed WMI client instead of hand-rolled `IWbemServices` plumbing.
wmi = { version = "0.18", default-features = false }
# Machine load for the system monitor (docs/modules/system-monitor.md): CPU, memory, volumes,
# network counters and the process walk. Without `multithread` the walk runs on the caller's
# thread instead of a rayon pool the tray-utility footprint has no room for.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
# Shelf thumbnails (docs/modules/shelf.md): the shell hands back an `HBITMAP`; this encodes the
# pixels as PNG for the webview. Same crate and version muna-core decodes artwork with.
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
  "ApplicationModel",
  "ApplicationModel_DataTransfer",
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Devices_Geolocation",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage",
  "Storage_Search",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "UI_Shell",
  "Win32_Devices_Bluetooth",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
# Compiles the `#[ignore]`d tests that call real Windows APIs; run with `-- --include-ignored`.
platform-tests = []

[lints]
workspace = true
