[package]
name = "muna-platform"
description = "Platform service traits, the scripted FakePlatform used by every test, and the Windows implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
parking_lot.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power"] }

[features]
default = []
# Compiles the `#[ignore]`d tests that call real Windows APIs; run with `-- --include-ignored`.
platform-tests = []

[lints]
workspace = true
