[package]
name = "muna-platform"
description = "Platform service traits, the scripted FakePlatform used by every test, and the Windows implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
parking_lot.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# webview2-com / windows-core track the versions wry uses so `ICoreWebView2Controller` is the
# same type Tauri hands out from `with_webview`.
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
# Compiles the `#[ignore]`d tests that call real Windows APIs; run with `-- --include-ignored`.
platform-tests = []

[lints]
workspace = true
